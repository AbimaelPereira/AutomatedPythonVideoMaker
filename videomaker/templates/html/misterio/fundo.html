<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
#__root{width:{{ w|default(1080) }}px;height:{{ h|default(1920) }}px;position:relative;overflow:hidden;
 background:radial-gradient(ellipse at 50% 30%, {{ cor|default('#1d2b3a') }} 0%, #070a10 55%, #000 100%)}
.fog{position:absolute;inset:-20%;background:
 radial-gradient(ellipse 60% 18% at 30% 70%, rgba(180,200,220,.10), transparent 70%),
 radial-gradient(ellipse 50% 14% at 75% 80%, rgba(180,200,220,.08), transparent 70%),
 radial-gradient(ellipse 70% 20% at 50% 92%, rgba(180,200,220,.12), transparent 70%)}
.beam{position:absolute;left:50%;top:22%;width:1600px;height:240px;transform-origin:0 50%;transform:rotate(-14deg);
 background:linear-gradient(90deg, rgba(255,210,120,.28), transparent 75%);filter:blur(18px)}
.grain{position:absolute;inset:0;opacity:.18;mix-blend-mode:overlay}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 260px 80px #000}
</style></head><body><div id="__root">
<div class="beam"></div><div class="fog"></div>
<svg class="grain" width="100%" height="100%"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="vig"></div></div></body></html>
