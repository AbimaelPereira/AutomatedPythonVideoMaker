<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Special+Elite&display=swap" rel="stylesheet"><style>
html,body{margin:0;background:transparent}#__root{display:inline-block;padding:40px}
.l{width:900px;position:relative;padding-left:70px}
.l:before{content:'';position:absolute;left:22px;top:20px;bottom:20px;width:4px;background:linear-gradient(#ffb547,#c4161c)}
.i{position:relative;margin:0 0 46px}
.i:before{content:'';position:absolute;left:-60px;top:12px;width:24px;height:24px;border-radius:50%;background:#000;border:5px solid #ffb547;box-shadow:0 0 20px #ffb547}
.i.alerta:before{border-color:#ff2a2a;box-shadow:0 0 26px #ff2a2a}
.d{font:600 34px Oswald;color:#ffb547;letter-spacing:3px}
.alerta .d{color:#ff4a4a}
.x{font:44px/1.2 'Special Elite';color:#f2ead8;text-shadow:0 2px 10px #000}
</style></head><body><div id="__root"><div class="l">
{% for e in eventos %}<div class="i {{ 'alerta' if e[2] is defined and e[2] else '' }}"><div class="d">{{ e[0] }}</div><div class="x">{{ e[1] }}</div></div>{% endfor %}
</div></div></body></html>
