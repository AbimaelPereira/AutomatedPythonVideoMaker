<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;900&display=swap" rel="stylesheet"><style>
html,body{margin:0;background:transparent}#__root{display:inline-block;padding:40px}
.w{width:920px;font-family:Inter;color:#fff}
.t{font:900 50px Inter;margin-bottom:30px;text-shadow:0 4px 20px #000;opacity:0;animation:in .5s ease-out var(--entra) forwards}
.bar{height:110px;border-radius:24px;overflow:hidden;display:flex;border:4px solid rgba(255,255,255,.8);background:#06142a;opacity:0;animation:in .4s ease-out var(--entra) forwards}
.a{background:linear-gradient(90deg,#00e5ff,#00b4d8);width:0;display:flex;align-items:center;justify-content:flex-end;padding-right:16px;box-sizing:border-box;font:40px Anton;color:#002;white-space:nowrap;
 animation:grow 1.2s cubic-bezier(.2,.9,.2,1) var(--cresce) forwards}
.b{flex:1;display:flex;align-items:center;justify-content:center;font:900 40px Inter;color:#ff4d6d;letter-spacing:3px;opacity:0;
 animation:in .3s var(--alerta) forwards, blink .5s steps(2) calc(var(--alerta) + .3s) 4}
@keyframes in{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes grow{to{width:{{ pct }}%}}
@keyframes blink{50%{opacity:.2}}
</style></head><body><div id="__root"><div class="w"><div class="t">{{ titulo }}</div>
<div class="bar"><div class="a"><span id="n">0</span>%</div><div class="b">{{ resto }}</div></div></div></div>
<script>
// contador sincronizado: sobe de 0 a pct junto com a barra
window.onFrame = t => { const s = SYNC.cresce, d = 1.2, p = Math.min(1, Math.max(0, (t - s) / d));
  const e = 1 - Math.pow(1 - p, 3); document.getElementById('n').textContent = Math.round(e * {{ pct }}); };
</script></body></html>
