[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "pymysql>=1.1",
  "cryptography>=43",
  "python-ulid>=3.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
